# Publica el sitio en GitHub Pages cada vez que se sube algo a la rama main.
# GitHub compila el sitio (npm run build, que ya minifica HTML, CSS y JS) y publica la carpeta dist/.
# El dominio es https://yeyotqm.life (Settings > Pages > Custom domain). Para cambiarlo sin tocar este
# archivo, define la variable SITE_URL en Settings > Secrets and variables > Actions > Variables.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://yeyotqm.life' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
